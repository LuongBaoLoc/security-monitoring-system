[package]
name = "smartsecure-esp32-firmware"
version = "1.0.0"
edition = "2021"
description = "SmartSecure ESP32 IoT Firmware in Rust (esp-idf-svc + MQTT + GPIO/ADC)"

[dependencies]
esp-idf-svc = { version = "0.49", features = ["binstart"] }
esp-idf-hal = "0.44"
esp-idf-sys = { version = "0.35", features = ["binstart"] }
embedded-svc = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

[build-dependencies]
embuild = "0.32"
