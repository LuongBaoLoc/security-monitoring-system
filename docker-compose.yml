services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-security_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-security}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-security} -d ${POSTGRES_DB:-security_monitor}"]
      interval: 5s
      timeout: 5s
      retries: 15

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-security}:${POSTGRES_PASSWORD:-local-change-me}@db:5432/${POSTGRES_DB:-security_monitor}
      SECRET_KEY: ${SECRET_KEY:-local-dev-only-change-before-deploying}
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      MQTT_ENABLED: "true"
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    ports:
      - "8080:80"

  ai-service:
    build: ./ai-service
    environment:
      BACKEND_URL: http://backend:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      MODEL_PATH: ${MODEL_PATH:-}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.6}
    volumes:
      - ./models:/models:ro
    depends_on:
      - backend
    ports:
      - "8001:8001"

volumes:
  postgres_data:
