[package]
name = "security-monitoring-ai-service"
version = "1.0.0"
edition = "2021"
description = "SmartSecure Security Monitoring System - Rust AI Detection Service"
default-run = "security-monitoring-ai-service"

[lib]
name = "ai_service"
path = "src/lib.rs"

[[bin]]
name = "security-monitoring-ai-service"
path = "src/main.rs"

[[bin]]
name = "test_yolo_sample"
path = "src/bin/test_yolo_sample.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
